name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Capture privacy check (no unmarked templates)
        run: cargo test -p zkteco-proto --test captures
      - run: cargo test --workspace
      - name: Docs (broken intra-doc links are errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
      - name: Demo device example builds as documented (no --features)
        run: cargo build -p zkteco-client --example demo_device
      - name: Man pages and completions build
        run: cargo xtask man target/man && cargo xtask completions target/completions

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv-clippy:
    # Lints can differ between toolchains; the MSRV build must be warning-free too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    # Licenses (permissive only, no GPL), advisories, duplicate versions, sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  publish-dry-run:
    # Packages and builds all three crates in dependency order, as crates.io would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  fixtures:
    # Regenerates the golden fixtures from pyzk and fails if they drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run tools/gen_fixtures.py
      - run: git diff --exit-code crates/zkteco-proto/tests/fixtures/generated
