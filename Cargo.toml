[workspace]
resolver = "2"
members = ["crates/zkteco-proto", "crates/zkteco-client", "crates/zkctl"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xeroxzen/ferrite-zk"
keywords = ["zkteco", "biometric", "attendance", "access-control", "time-clock"]
categories = ["hardware-support", "network-programming"]
exclude = ["/tools", "/tests/fixtures/captures"]

[workspace.dependencies]
zkteco-proto = { path = "crates/zkteco-proto", version = "0.1.0-alpha.1" }
bitflags = "2.6"
bytes = "1.7"
chrono = { version = "0.4.38", default-features = false, features = ["alloc"] }
encoding_rs = "0.8.34"
thiserror = "2.0"
tracing = "0.1.40"
hex = "0.4.3"
proptest = "1.5"
serde_json = "1.0.128"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
