[workspace]
resolver = "2"
members = ["crates/zkteco-proto", "crates/zkteco-client", "crates/zkctl", "xtask"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xeroxzen/ferrite-zk"
keywords = ["zkteco", "biometric", "attendance", "access-control", "time-clock"]
categories = ["hardware-support", "network-programming"]
exclude = ["/tools", "/tests/fixtures/captures"]

[workspace.dependencies]
zkteco-proto = { path = "crates/zkteco-proto", version = "0.1.0-alpha.1" }
bitflags = "2.6"
bytes = "1.7"
chrono = { version = "0.4.38", default-features = false, features = ["alloc"] }
encoding_rs = "0.8.34"
thiserror = "2.0"
tracing = "0.1.40"
hex = "0.4.3"
proptest = "1.5"
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0.89"
assert_cmd = "2.0.16"
clap_complete = "4.5"
clap_mangen = "0.2.24"
directories = "6.0"
jsonschema = { version = "0.61.2", default-features = false }
insta = { version = "1.41", features = ["json", "redactions"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
sha2 = "0.11"
rpassword = "7.3"
tempfile = "3.13"
toml = "0.8.19"
futures-core = "0.3.31"
socket2 = { version = "0.5.7", features = ["all"] }
futures-util = { version = "0.3.31", default-features = false }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zkteco-client = { path = "crates/zkteco-client", version = "0.1.0-alpha.1" }
zkctl = { path = "crates/zkctl", version = "0.1.0-alpha.1" }
tokio = { version = "1.40", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
