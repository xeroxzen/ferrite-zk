[package]
name = "zkctl"
description = "Command-line tool for ZKTeco biometric and access-control devices: device info, users, attendance export, live event streaming, enrolment. Built on zkteco-client. Part of the Ferrite project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["zkteco", "attendance", "biometric", "cli", "access-control"]
categories = ["command-line-utilities", "hardware-support"]
# The tests need the workspace (the mock device, docs/schema), so they are
# not published.
exclude = ["/tests"]
readme = "README.md"
documentation = "https://docs.rs/zkctl"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std", "serde"] }
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
hex.workspace = true
keyring.workspace = true
rpassword.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zkteco-client.workspace = true
zkteco-proto.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "net", "io-util", "process"] }
# The mock device, zkteco_client::demo.
zkteco-client = { workspace = true, features = ["demo"] }
