[package]
name = "zkteco-client"
description = "Async (tokio) client for ZKTeco biometric and access-control devices over TCP and UDP, with feature parity with pyzk. Part of the Ferrite project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
# Not published until the maintainer reviews phase 3.
publish = false

[features]
# Enables tests against a real device (tests/hardware.rs). See that file for
# the environment variables.
hardware = []

[dependencies]
bytes.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tracing.workspace = true
zkteco-proto.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "io-util", "rt", "macros", "sync"] }

[lints]
workspace = true
