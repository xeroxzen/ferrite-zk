[package]
name = "zkteco-client"
description = "Async (tokio) client for ZKTeco biometric and access-control devices over TCP and UDP, with feature parity with pyzk. Part of the Ferrite project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
readme = "README.md"
documentation = "https://docs.rs/zkteco-client"

[features]
# Enables tests against a real device (tests/hardware.rs). See that file for
# the environment variables.
hardware = []
# The mock device (`zkteco_client::demo`, hidden from the documentation):
# for this workspace's tests and the `demo_device` example. Not part of the
# API; may change in any release.
demo = ["tokio/rt", "tokio/sync", "tokio/macros"]

[dependencies]
bytes.workspace = true
chrono.workspace = true
futures-core.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tracing.workspace = true
zkteco-proto.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["clock"] }
futures-util.workspace = true
# Itself with the mock device, for the tests and examples, so `cargo run
# --example demo_device` needs no `--features`. Stripped on publish.
zkteco-client = { path = ".", features = ["demo"] }
tokio = { workspace = true, features = ["net", "time", "io-util", "rt", "rt-multi-thread", "macros", "sync", "signal"] }

# The mock device needs `demo`, which the dev-dependency on itself enables
# here; a build from the published package without it skips these.
[[example]]
name = "demo_device"
required-features = ["demo"]

[[test]]
name = "enroll"
required-features = ["demo"]

[[test]]
name = "examples"
required-features = ["demo"]

[[test]]
name = "live"
required-features = ["demo"]

[[test]]
name = "modes"
required-features = ["demo"]

[[test]]
name = "tcp"
required-features = ["demo"]

[[test]]
name = "udp"
required-features = ["demo"]

[lints]
workspace = true
